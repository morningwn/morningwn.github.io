  <script>
      (function () {
          var themes = {
              'deep-ocean': '#0F111A', 'oceanic': '#263238', 'palenight': '#292D3E', 'darker': '#212121',
              'lighter': '#FAFAFA', 'sky-blue': '#F5F5F5', 'sandy': '#FFF8ED', 'solarized': '#fdf6e3'
          };
          var t = localStorage.getItem('site-theme');
          var resolved;
          if (t && themes[t]) {
              resolved = t;
          } else {
              resolved = window.matchMedia('(prefers-color-scheme:light)').matches ? 'lighter' : 'deep-ocean';
          }
          document.documentElement.setAttribute('data-theme', resolved);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', themes[resolved]);
      })()
  </script>
